# 数据库已切换为 SQLite（文件位于 apps/api/prisma/dev.db），本地开发不再需要 Docker 启动 Postgres。
# 这里仅保留 Redis，供后续异步任务 / 缓存（BullMQ）启用时使用，当前可不启动。
services:
  redis:
    image: redis:7-alpine
    container_name: home-pantry-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - home_pantry_redisdata:/data
volumes:
  home_pantry_redisdata:
