services:
  postgres:
    image: postgres:17-alpine
    container_name: home-pantry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: home_pantry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - home_pantry_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d home_pantry"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: home-pantry-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - home_pantry_redisdata:/data
volumes:
  home_pantry_pgdata:
  home_pantry_redisdata:
